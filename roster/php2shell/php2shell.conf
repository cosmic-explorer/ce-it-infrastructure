# Interim mitigations for CVE-2026-109618 / CVE-2026-109619 ("PHP2Shell") in
# the COmanage container (PHP 7.3 under mod_php; no upstream fix exists for
# 7.3). Installed from ce-it-infrastructure/roster/php2shell/ by
# apply-php2shell-mitigations.sh, which Includes this file INSIDE the
# <VirtualHost *:443> block after the registry's own <Location /> so that
# nothing below is overridden by the vhost's lazy "Require shibboleth".

# CVE-2026-109618: remove PHP's own, attacker-reachable memory-limit failure
# path, as the advisory recommends, and let the container cgroup be the
# availability boundary (docker update --memory on the container). Set with
# php_admin_value so no application or .htaccess can put a finite limit back.
php_admin_value memory_limit -1

# Only the registry and the Shibboleth handler are legitimate URLs on this
# virtual host. Everything else (bots probing for /wp-login.php, /bro.php and
# the like: 2,134 hits in the week before this change) was handed to mod_php
# for a "file not found"; deny it before PHP sees it. "/", the static front
# page it serves (/index.html, see roster/frontpage/) and /favicon.ico stay
# allowed.
<LocationMatch "^/(?!$|index\.html$|favicon\.ico$|registry(/|$)|Shibboleth\.sso(/|$)).">
    Require all denied
</LocationMatch>

# Login gate (enabled 2026-10-24 on ITS advice): require a Shibboleth session
# before any request under /registry reaches mod_php, so unauthenticated
# traffic never touches PHP. Anyone with a federated login (including the
# ORCID gateway) can still reach PHP, so this reduces rather than removes
# exposure. Anonymous visitors now go straight to the identity-provider
# chooser instead of the registry Home page.
#
# Exceptions must be expressed on the ORIGINAL request line (THE_REQUEST):
# CakePHP's .htaccess rewrites every URL to /registry/index.php and Apache
# re-runs the Location merge on the rewritten URI, so a LocationMatch on
# ".json" would never see the rewritten request. mod_shib enforces
# requireSession before Require is evaluated, so the exceptions must also
# switch it off.
<Location /registry>
    AuthType shibboleth
    ShibRequestSetting requireSession 1
    Require shib-session

    # Static assets: no session needed.
    <If "%{THE_REQUEST} =~ m#^[A-Z]+ /registry/(css|js|img|files|local-resources)/# || %{THE_REQUEST} =~ m#^[A-Z]+ /registry/favicon\.ico#">
        ShibRequestSetting requireSession 0
        Require all granted
    </If>

    # REST API (HTTP Basic, API users): cannot carry a Shibboleth session, so
    # allow only from this host and the container networks.
    <ElseIf "%{THE_REQUEST} =~ m#^[A-Z]+ /registry/[^ ?]*\.json([? ])#">
        ShibRequestSetting requireSession 0
        Require ip 192.168.100.1 172.30.100.0/24 128.230.146.17
    </ElseIf>
</Location>
