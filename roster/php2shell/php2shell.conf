# Interim mitigations for CVE-2026-109618 / CVE-2026-109619 ("PHP2Shell") in
# the COmanage container (PHP 7.3 under mod_php; no upstream fix exists for
# 7.3). Installed from ce-it-infrastructure/roster/php2shell/ by
# apply-php2shell-mitigations.sh, which also Includes this file INSIDE the
# <VirtualHost *:443> block after the registry's own <Location /> so that the
# denial below is not overridden by the vhost's "Require shibboleth".

# CVE-2026-109618: remove PHP's own, attacker-reachable memory-limit failure
# path, as the advisory recommends, and let the container cgroup be the
# availability boundary (docker update --memory on the container). Set with
# php_admin_value so no application or .htaccess can put a finite limit back.
php_admin_value memory_limit -1

# Only the registry and the Shibboleth handler are legitimate URLs on this
# virtual host. Everything else (bots probing for /wp-login.php, /bro.php and
# the like: 2,134 hits in the week before this change) was handed to mod_php
# for a "file not found"; deny it before PHP sees it. "/" itself stays allowed
# so the redirect to /registry/ keeps working.
<LocationMatch "^/(?!$|registry(/|$)|Shibboleth\.sso(/|$)).">
    Require all denied
</LocationMatch>
