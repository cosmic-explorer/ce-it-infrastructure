; Interim mitigations for CVE-2026-109618 / CVE-2026-109619 ("PHP2Shell"),
; per the php.net advisory of 2026-10-21. PHP 7.3 receives no fix; these
; reduce exposure to the confirmed attack paths but do not make PHP 7.3 safe.
; Installed 2026-10-22 from ce-it-infrastructure/roster/php2shell/.

; CVE-2026-109619: blocks the confirmed session upload-progress path.
session.upload_progress.enabled = 0

; CVE-2026-109618: keep request bodies small (COmanage needs no large uploads).
post_max_size = 8M
upload_max_filesize = 2M
max_input_vars = 1000
max_input_nesting_level = 16

; Hygiene: do not leak version or diagnostics (advisory notes this does not
; itself block the bugs).
expose_php = Off
display_errors = Off
